name: Build & Release SheIn Connect

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release? (true/false)'
        required: true
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. ANDROID BUILD JOB (APK & App Bundle)
  # =========================================================================
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env Configuration
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://wnymhjywhimllbofbcep.supabase.co' }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_5HT_EBKgjDwbrQDL_qBjZw_jm77GLdi' }}" >> .env
          echo "APP_ENV=production" >> .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Quality
        run: flutter analyze lib/

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Build Android App Bundle (Release)
        run: flutter build appbundle --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shein-connect-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shein-connect-android-bundle
          path: build/app/outputs/bundle/release/app-release.aab

  # =========================================================================
  # 2. LINUX DESKTOP BUILD JOB (Tarball)
  # =========================================================================
  build-linux:
    name: Build Linux Desktop (Bundle)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Create .env Configuration
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://wnymhjywhimllbofbcep.supabase.co' }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_5HT_EBKgjDwbrQDL_qBjZw_jm77GLdi' }}" >> .env
          echo "APP_ENV=production" >> .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Desktop (Release)
        run: flutter build linux --release

      - name: Package Linux Bundle into Tarball
        run: |
          tar -czf shein-connect-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shein-connect-linux-x64
          path: shein-connect-linux-x64.tar.gz

  # =========================================================================
  # 3. IOS BUILD JOB (Unsigned .app & Payload .ipa)
  # =========================================================================
  build-ios:
    name: Build iOS (IPA & App Bundle)
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env Configuration
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://wnymhjywhimllbofbcep.supabase.co' }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_5HT_EBKgjDwbrQDL_qBjZw_jm77GLdi' }}" >> .env
          echo "APP_ENV=production" >> .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Release, No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Payload Archive into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r shein-connect-ios-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shein-connect-ios-unsigned
          path: shein-connect-ios-unsigned.ipa

  # =========================================================================
  # 4. GITHUB RELEASE JOB
  # Publishes compiled binaries when pushed with tags (v*) or via manual dispatch
  # =========================================================================
  create-release:
    name: Publish GitHub Release
    needs: [build-android, build-linux, build-ios]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: shein-connect-android-apk
          path: release-assets/

      - name: Rename Android APK for Release
        run: mv release-assets/app-release.apk release-assets/SheIn-Connect-Android.apk

      - name: Download Android Bundle
        uses: actions/download-artifact@v4
        with:
          name: shein-connect-android-bundle
          path: release-assets/

      - name: Rename Android Bundle for Release
        run: mv release-assets/app-release.aab release-assets/SheIn-Connect-Android.aab

      - name: Download Linux Bundle
        uses: actions/download-artifact@v4
        with:
          name: shein-connect-linux-x64
          path: release-assets/

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: shein-connect-ios-unsigned
          path: release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/SheIn-Connect-Android.apk
            release-assets/SheIn-Connect-Android.aab
            release-assets/shein-connect-linux-x64.tar.gz
            release-assets/shein-connect-ios-unsigned.ipa
          tag_name: ${{ github.ref_name }}
          name: "SheIn Connect ${{ github.ref_name }}"
          body: |
            ## 🛍️ SheIn Connect Production Release

            Cross-platform binaries compiled automatically with GitHub Actions:

            ### 📦 Included Artifacts:
            * **Android**:
              * `SheIn-Connect-Android.apk` (Direct installable APK)
              * `SheIn-Connect-Android.aab` (Google Play Store App Bundle)
            * **Linux**:
              * `shein-connect-linux-x64.tar.gz` (Standalone Linux Desktop GTK bundle)
            * **iOS**:
              * `shein-connect-ios-unsigned.ipa` (Unsigned iOS app bundle for sideloading / distribution signing)

            ---
            *Powered by Techlink360 • Built with Flutter & Supabase*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
